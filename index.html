<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Favorite Person ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    
    .container {
      width: 90%;
      max-width: 600px;
      margin: 40px auto;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #e63946;
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
      color: #555;
    }

    .photo-frame {
      width: 100%;
      height: 250px;
      border-radius: 15px;
      object-fit: cover;
      margin: 20px 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .interactive-btn {
      background-color: #ff4b2b;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      margin-top: 15px;
    }

    .interactive-btn:hover {
      background-color: #ff416c;
      transform: scale(1.05);
    }

    #secret-message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #ffe6e6;
      border-radius: 10px;
      border: 1px dashed #ff4b2b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>To My Favorite Person ❤️</h1>
    <p>I built this little page just for you...</p>

    <img class="photo-frame" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800&q=80" alt="Us">

    <iframe style="border-radius:12px; margin-top: 15px;" src="https://open.spotify.com/embed/track/1BxfayL1e3ayRhkM3L2iA5?utm_source=generator" width="100%" height="80" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

    <br>
    <button class="interactive-btn" onclick="toggleMessage()">Click for a Surprise 💌</button>

    <div id="secret-message">
      <p><strong>Reasons why I love you:</strong></p>
      <p>1. You make me laugh every single day.<br>
         2. You have the kindest heart.<br>
         3. I love building memories with you!</p>
    </div>
  </div>

  <script>
    function toggleMessage() {
      const msg = document.getElementById('secret-message');
      if (msg.style.display === 'block') {
        msg.style.display = 'none';
      } else {
        msg.style.display = 'block';
      }
    }
  </script>

</body>
</html>
